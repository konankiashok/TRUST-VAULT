{% extends "base.html" %}{% block title %}Users{% endblock %}
{% block body %}<h1>Users</h1>
<div class="card"><h2>Create user</h2><form method="post" class="row">
<input type="hidden" name="csrf_token" value="{{ g.csrf }}">
<label>Username<input name="username" required maxlength="32"></label>
<label>Password (min 10)<input name="password" type="password" required minlength="10"></label>
<label>Role<select name="role"><option>viewer</option><option>owner</option><option>admin</option></select></label><button>Create</button></form></div>
<div class="card wrap"><table><tr><th>User</th><th>Role</th><th>Status</th><th></th></tr>
{% for r in rows %}<tr><td>{{ r['username'] }}</td><td>{{ r['role'] }}</td>
<td>{% if r['active'] %}<span class="tag allowed">active</span>{% else %}<span class="tag denied">disabled</span>{% endif %}</td>
<td>{% if r['id'] != g.user['id'] %}<form method="post" action="{{ url_for('admin.set_state', user_id=r['id'], state=('disable' if r['active'] else 'enable')) }}">
<input type="hidden" name="csrf_token" value="{{ g.csrf }}"><button class="sec">{{ 'Disable' if r['active'] else 'Enable' }}</button></form>{% endif %}</td></tr>{% endfor %}</table></div>{% endblock %}
