{% extends "base.html" %}{% block title %}Sign in - TrustVault{% endblock %}
{% block body %}
<div class="card" style="max-width:380px;margin:3rem auto">
<h1>Sign in</h1>
{% if error %}<div class="flash error">{{ error }}</div>{% endif %}
<form method="post" action="{{ url_for('main.login') }}" class="row" style="flex-direction:column;align-items:stretch">
<input type="hidden" name="csrf_token" value="{{ login_csrf }}">
<label>Username<input name="username" autocomplete="username" required maxlength="64"></label>
<label>Password<input name="password" type="password" autocomplete="current-password" required></label>
<button>Sign in</button></form></div>
{% endblock %}
